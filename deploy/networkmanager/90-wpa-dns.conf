# NetworkManager must not write /etc/resolv.conf on this box.
#
# WHY: the LAN router at 10.10.0.138 answers glibc's queries and does NOT answer the
# Go resolver's. Measured 2026-08-15 against the GitHub MCP server — 14 of 15 lookups
# failed with
#
#   dial tcp: lookup api.github.com on 10.10.0.138:53: no such host
#
# while `getent ahosts api.github.com` succeeded 10 of 10 and curl returned 200.
# Pointing the box at a public resolver takes the same test to 15 of 15. The symptom
# reaching a human was an agent saying "DNS blip, retrying", which is why it went
# three sightings before anyone measured it.
#
# This is bigger than one tool: every statically linked Go binary here uses the pure
# Go resolver and hits it. `GODEBUG=netdns=cgo` is NOT a fix for those — it selects a
# resolver that is not compiled into a CGO_ENABLED=0 build, so it silently did
# nothing for github-mcp-server while genuinely fixing dockerd, which is dynamically
# linked. Two binaries, same symptom, and only one of them could take that cure.
#
# `dns=none` rather than per-connection `ipv4.dns`: NM merges DNS from every active
# connection, so setting it on one leaves the other injecting the router at the top
# of the list — observed here, with eth0 configured and wlan0 not. Taking NM out of
# the loop does not depend on which interface came up last.
#
# Install: this file, then `systemctl reload NetworkManager`, then write
# /etc/resolv.conf. A reload does not bounce links, which matters because SSH to this
# box arrives over wlan0 and `nmcli con up` on it would cut the session doing the fix.
[main]
dns=none
