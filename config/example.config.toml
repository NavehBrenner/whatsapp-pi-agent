# Copy to config/config.toml and edit. config.toml is gitignored.
# Secrets do NOT go in here — see docs/runbooks/04-agent-deploy.md.

[whatsapp]
# Waydroid's Android data dir on the host. Read-only, never opened read-write.
# NOTE: under the session user's home, NOT /var/lib/waydroid (verified 2026-08-10).
databases_dir = "~/.local/share/waydroid/data/data/com.whatsapp/databases"

# Snapshot target. msgstore.db + -wal + -shm + wa.db are copied here together;
# reading msgstore.db alone silently returns stale data (ADR 0003).
# MUST be tmpfs or every poll writes ~60MB to the SD card. /tmp is NOT tmpfs on
# Raspberry Pi OS — it is on the boot medium, merely cleared at boot. /dev/shm is.
snapshot_dir = "/dev/shm/wpa-snapshot"

# Pinned APK version. The msgstore schema is tied to it — update deliberately.
# Fill in after the spike (OPEN-QUESTIONS Q2).
pinned_version = ""

# Only these chats are read. Chat JIDs — NOT group names, which anyone in the
# group can change. List them with:
#   sudo sqlite3 /dev/shm/wpa-snapshot/msgstore.db \
#     'SELECT j.raw_string, c.subject FROM chat c JOIN jid j ON j._id=c.jid_row_id'
# Empty = read nothing, which is the safe default. The reader refuses to start
# without this file rather than falling back to reading every chat.
chats = [
  # "1234567890-1234567890@g.us",
]

[signal]
# The assistant's own dedicated account (ADR 0004), E.164.
account = "+441234567890"

# The daemon's JSON-RPC socket. Created by signal-cli.service with UMask=0007, so
# it is readable by the wpa-signal group and the gate joins that group.
socket = "/run/wpa-signal/socket"

# Where a membership-drift notice goes: a conversation label from below. Unset means
# the gate only logs it, and a refusing group is then indistinguishable from a quiet
# one until somebody reads the journal.
# notify = "owner-1to1"

# ---------------------------------------------------------------------------
# Conversations: the closed set of rooms the assistant will act in.
#
# **Authority is a (conversation, sender) pair, never a sender alone** (ADR 0008).
# The same person in a group and in their own chat are two principals with two
# profiles, and the group one must be the narrower: a reply there is read by
# everyone in the room, including people who did not ask.
#
# Every conversation has the SAME shape. There is no direct/group switch — a
# one-to-one is a conversation whose `id` is the other party's ACI and whose member
# set is exactly that one person. Which kind it is, is derived from the id (an ACI
# parses as a UUID; a group id does not), so config cannot disagree with itself.
#
# `agent` and `profile` are required, and they are the room's default: everyone
# listed talks to that agent holding that profile. A sender row may override either,
# which is how one person gets their own session in a shared room.
#
# KEY SENDERS ON THE UUID. Signal does not share phone numbers by default, so real
# envelopes arrive with `sourceNumber: null` and a number-only row matches nothing
# (verified on hardware 2026-08-11). Read the sender's ACI off the wire:
#
#   sudo -u wpa-signal python3 -c 'import socket,sys
#   s=socket.socket(socket.AF_UNIX); s.connect("/run/wpa-signal/socket")
#   [sys.stdout.write(l) for l in s.makefile("r")]' | head -1
#
# then message the assistant from the phone you want to allow. `number` is optional
# and is only a second key — the part a human can check by eye.
#
# **AN ACI IS NOT THE ONLY UUID A PERSON HAS.** They also have a PNI, their
# phone-number identity, and `getUserStatus` returns it — in a field called `uuid`,
# with no marking — for anyone the account does not know yet. Verified 2026-08-16:
# the same number returned a different uuid before and after the person joined a
# group. A PNI here refuses every message in silence, exactly like the number-keyed
# row above. Take the id from the wire, from `listGroups` members, or from the `aci`
# column of the daemon's `recipient` table — never from a lookup alone.
#
# GROUPS ARE KEYED BY ID, never by name: names are chosen by members, so a
# name-keyed allowlist can be renamed into. `members` is the PINNED member set: the
# gate reads the live membership back from the daemon and refuses the whole
# conversation when it differs, rather than carrying on with an extra person present.
#
# **The assistant is itself a member of the group**, so its own ACI belongs in that
# list too (verified on hardware 2026-08-12 — omit it and the group refuses forever).
# Generate the id and the members rather than typing them:
#
#   sudo -u wpa-signal python3 deploy/pin-group.py
#
# which prints a ready-to-paste `label`/`id`/`members` block for every group the
# assistant is in. Read the label before pasting it — it is the current group name,
# and the name is exactly the thing not to trust for identity.
#
# Check what any of this resolves to before restarting the gate:
#   python3 -m gate.signal --check /opt/wpa/config/config.toml
# ---------------------------------------------------------------------------

[[signal.conversations]]
label   = "owner-1to1"
id      = "00000000-0000-0000-0000-000000000000"   # the owner's ACI
members = ["00000000-0000-0000-0000-000000000000"] # a one-to-one: exactly the id
agent   = "owner"
profile = "owner-full"
[[signal.conversations.senders]]
uuid = "00000000-0000-0000-0000-000000000000"
name = "owner"                                     # the pair name: unique everywhere
# number = "+447700900000"

# A project room: one repo, one room, one agent. The owner is the only member, so
# nothing here is about keeping people apart — it is about keeping *contexts* apart.
#
# Why it cannot be the `owner` agent, however much it would be convenient: an agent
# named in two conversations is a refusal at load ("an agent session may not span
# conversations"). That refusal is doing real work here rather than being a formality.
# This room ingests text the owner did not write — issue bodies and PR titles from
# public repos, arriving through a notifier — which is attacker-influenceable content
# entering an agent with durable memory. A shared session would carry a poisoned issue
# straight into the private chat, and a shared workspace would persist it in the same
# MEMORY.md. Separate agent, separate workspace, separate memory is the containment,
# and the cost is that the project room does not remember the DM's context.
#
# `send_to` on its profile is ["self"] — the room it serves and nowhere else. Combined
# with the pinned `members` set, that is what makes this room safe to write into
# unprompted: a member added since the pin drifts the room, and a drifted room drops
# outbound as well as inbound (see `drain`).
#
# [[signal.conversations]]
# label   = "qualety"
# id      = "<group id>"                        # deploy/pin-group.py prints both lines
# members = ["<assistant uuid>", "<owner uuid>"]  # TWO: the assistant is a member too
# agent   = "qualety"
# profile = "project"
# purpose = "the qualety repo: plans, PRs, CI"
# [[signal.conversations.senders]]
# uuid = "<owner uuid>"
# name = "owner-qualety"                        # the pair name: unique everywhere

# The room where this repo is worked on (NVB-34). Same shape as the project room
# above, one step closer to home: it reads the source that defines every agent on the
# box. It shares the `project` profile rather than having its own — the two bundles
# are identical today, and a profile is a bundle, not an identity. They split when
# the grants actually differ, not before.
#
# [[signal.conversations]]
# label   = "builder"
# id      = "<group id>"                        # deploy/pin-group.py prints both lines
# members = ["<assistant uuid>", "<owner uuid>"]  # TWO: the assistant is a member too
# agent   = "builder"
# profile = "project"
# purpose = "the whatsapp-pi-agent repo: the agent that builds it"
# [[signal.conversations.senders]]
# uuid = "<owner uuid>"
# name = "owner-builder"

# One 1:1 per family member. Three conversations, three agents, three profiles' worth
# of the same bundle — a DM is a conversation whose id is the other party's ACI and
# whose member set is exactly that person, so these have the same shape as owner-1to1
# and differ only in who and how much.
#
# `family-dm` is narrower than `owner-full`: it is the same tool surface the assistant
# runs with today, minus the WhatsApp read. Nobody but the owner gets a view of the
# owner's chats, and a private DM is not a reason to widen that.
#
# [[signal.conversations]]
# label   = "alice-1to1"
# id      = "<alice uuid>"
# members = ["<alice uuid>"]
# agent   = "alice"
# profile = "family-dm"
# [[signal.conversations.senders]]
# uuid = "<alice uuid>"
# name = "alice"
#
# [[signal.conversations]]
# label   = "bob-1to1"
# id      = "<bob uuid>"
# members = ["<bob uuid>"]
# agent   = "bob"
# profile = "family-dm"
# [[signal.conversations.senders]]
# uuid = "<bob uuid>"
# name = "bob"
#
# [[signal.conversations]]
# label   = "carol-1to1"
# id      = "<carol uuid>"
# members = ["<carol uuid>"]
# agent   = "carol"
# profile = "family-dm"
# [[signal.conversations.senders]]
# uuid = "<carol uuid>"
# name = "carol"

# A family group. Everyone listed reaches ONE shared agent holding a narrow profile,
# except the owner, who overrides both to get their own session with more reach.
# Uncomment and fill in to add it.
#
# [[signal.conversations]]
# label   = "family"
# id      = "<base64 groupId from listGroups>"
# members = ["<owner uuid>", "<mom uuid>", "<dad uuid>"]
# agent   = "family"
# profile = "family-shared"
# [[signal.conversations.senders]]
# uuid = "<mom uuid>"
# name = "mom-family"          # inherits agent "family" and profile "family-shared"
# [[signal.conversations.senders]]
# uuid = "<dad uuid>"
# name = "dad-family"          # same agent, so the same session, on purpose
# [[signal.conversations.senders]]
# uuid = "<owner uuid>"
# name = "owner-family"
# agent   = "owner-family"     # own session in this room…
# profile = "owner-in-group"   # …wider, but still only things the room may read

# A conversation whose entire purpose is answering prompts. Nothing in it is ever a
# command: only a reply quoting one of the assistant's own messages counts, so a
# stray message here authorises nothing by construction (ADR 0008).
#
# [[signal.conversations]]
# label   = "confirmations"
# id      = "<base64 groupId>"
# members = ["<owner uuid>", "<mom uuid>"]
# agent   = "confirmations"
# profile = "read-only"
# purpose = "confirmation"
# [[signal.conversations.senders]]
# uuid = "<owner uuid>"
# name = "owner-confirm"

[agent]
# ---------------------------------------------------------------------------
# Profiles: a named bundle of grants, bound to a pair before any agent exists.
#
# This is the GitHub-PAT shape — a coarse bundle for your own chat, a fine-grained
# one for a single capability in a shared room — with one difference that matters: a
# PAT is presented at request time and can be stolen or replayed, whereas a profile
# is compiled into the container. A tool outside the bundle is not refused at
# runtime, it is **absent**, and its credential was never mounted (ADR 0010).
#
# `tools` names entries in src/agent/registry.py, each already bound to one account
# and one verb. Granularity is which instances you list — `calendar.family.rw` and
# `calendar.family.create_event` are two grants over one calendar, and
# `calendar.personal.rw` is a different account. A name that is not in the registry
# refuses to start rather than granting nothing quietly.
#
# `send_to` is a capability too: which conversations an agent may message, by label.
# Default is ["self"] — the conversation it serves, which is what an agent granted
# nothing can still answer.
# ---------------------------------------------------------------------------

[[agent.profiles]]
name  = "owner-full"
tools = ["whatsapp.read", "calendar.personal.rw", "calendar.family.rw",
         "email.personal.draft", "notes.rw"]
# send_to = ["self", "family"]

# The owner in a project room. Same tools as `owner-full` — it is the owner, alone, in
# a room of his own — but a profile is a bundle of tools AND a send list, and the send
# list is the reason this cannot simply reuse `owner-full`: that one may address
# `family`, and an agent driven by public issue text must not be able to speak into the
# family room. ["self"] is the default and is left implicit.
#
# `whatsapp.read` is deliberately NOT here, and it is the one grant this profile was
# asked to carry. The question the repo puts to every grant — what does a successful
# injection do with this — has an unusually concrete answer in a room fed by public
# issue text: it reads the owner's WhatsApp and writes what it finds somewhere. The
# disclosure would be bounded to the owner, since he is the only member, but a code
# room has no use for it, and a grant that buys nothing is all cost.
# [[agent.profiles]]
# name  = "project"
# tools = ["calendar.personal.rw", "calendar.family.rw",
#          "email.personal.draft", "notes.rw"]

# A family member in their own chat. Shared by all three of them as a NAME, not as a
# session — each names it from their own conversation, and a profile is a bundle, not
# an identity. `send_to` stays at the default ["self"]: an agent that can address the
# family room from a private DM is a way to speak to the room as the assistant.
# [[agent.profiles]]
# name  = "family-dm"
# tools = ["calendar.family.rw", "notes.rw"]

# The owner, in a room other people read. Narrower than owner-full on purpose: a
# reply here is disclosed to everyone present, so this is an egress boundary and not
# only an invocation one.
# [[agent.profiles]]
# name  = "owner-in-group"
# tools = ["whatsapp.read", "calendar.family.rw", "notes.rw"]

# [[agent.profiles]]
# name  = "family-shared"
# tools = ["whatsapp.read", "calendar.family.rw"]

# The fine-grained end: one capability, one account.
# [[agent.profiles]]
# name  = "calendar-only"
# tools = ["calendar.family.create_event"]

# [[agent.profiles]]
# name  = "read-only"
# tools = []

# Recipients the agent may address outside Signal. Anything outside this is refused
# before the confirmation prompt is even shown (threat-model control 6).
egress_allowlist = [
  # "me@example.com",
]

# Confirmation gate. Leave on. If it fires constantly, the tool set is wrong, not the gate.
confirm_outbound = true

# ponytail: no [logging] section — journald handles it, and message content
# must never be logged anyway (threat-model R4).
