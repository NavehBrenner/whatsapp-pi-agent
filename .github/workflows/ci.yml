name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exact version: setup-uv stopped publishing moving major tags after v7,
      # so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # The Python version comes from .python-version — 3.11, matching the Pi
      # (Raspberry Pi OS Bookworm ships 3.11.2), and uv installs it here and on
      # the dev box alike. Testing on a newer Python than we deploy on would
      # hide real breakage, and it used to: the dev venv was 3.12.
      #
      # --locked fails if uv.lock is stale rather than silently resolving
      # something else, so CI can't pass on a dependency set nobody has.
      - name: mypy (strict)
        run: uv run --locked mypy

      - name: pytest
        run: uv run --locked pytest
