name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the Pi (Raspberry Pi OS Bookworm ships 3.11.2). Testing on a
          # newer Python than we deploy on would hide real breakage.
          python-version: "3.11"

      - name: Install dev tooling
        run: python -m pip install --upgrade pip mypy pytest

      - name: mypy (strict)
        run: mypy

      - name: pytest
        run: pytest
